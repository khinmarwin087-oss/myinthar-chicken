<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store - All in One</title>
    
    <style>
        /* CSS အပိုင်းကို HTML ထဲမှာ တစ်ခါတည်း ထည့်ထားတာပါ */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #fafafa; 
            margin: 0; 
            padding: 15px; 
        }

        h2 { text-align: center; color: #333; margin-bottom: 20px; }

        .menu-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }

        .card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            cursor: pointer;
        }

        .card img { 
            width: 100%; 
            height: 180px; 
            object-fit: cover; 
        }

        .card-body { padding: 10px; text-align: center; }
        .card-body h4 { margin: 5px 0; font-size: 14px; color: #444; }
        .price { color: #d97706; font-weight: bold; margin: 0; }

        /* Modal / Popup */
        .overlay { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.8); 
            z-index: 1000; 
            align-items: flex-end; 
        }

        .modal-sheet { 
            background: white; 
            width: 100%; 
            border-radius: 20px 20px 0 0; 
            max-height: 90vh; 
            overflow-y: auto; 
            position: relative;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* 🖼️ Image Slider */
        .slider-area { 
            position: relative; 
            height: 380px; 
            background: #f0f0f0; 
        }

        .slider-container { 
            display: flex; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            height: 100%; 
            scrollbar-width: none; 
        }

        .slider-container img { 
            width: 100%; 
            flex-shrink: 0; 
            object-fit: cover; 
            scroll-snap-align: start; 
        }

        .img-count { 
            position: absolute; 
            bottom: 15px; 
            right: 15px; 
            background: rgba(0,0,0,0.6); 
            color: white; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
        }

        .close-btn { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            background: white; 
            border: none; 
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            cursor: pointer; 
            z-index: 10; 
            font-size: 18px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .details { padding: 20px; }
        .price-tag { color: #d97706; font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .desc { color: #666; line-height: 1.6; font-size: 14px; margin-bottom: 20px; }

        .add-to-cart { 
            width: 100%; 
            padding: 16px; 
            background: #111827; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <h2>👕 Fashion Store</h2>
    
    <div id="grid-box" class="menu-grid"></div>

    <div id="detailPopup" class="overlay">
        <div class="modal-sheet">
            <div class="slider-area">
                <button class="close-btn" onclick="hideDetail()">✕</button>
                <div class="slider-container" id="slider-content"></div>
                <div class="img-count" id="badge">1 / 1</div>
            </div>
            <div class="details" id="details-content"></div>
        </div>
    </div>

    <script src="menu.js"></script>
    <script src="app.js"></script>

</body>
</html>

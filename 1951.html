let isShopOpen = true; // ဆိုင်အဖွင့်အပိတ် (Default အနေဖြင့် ပုံမှန်ဖွင့်ထားမည်)

function renderMenu() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const grid = document.getElementById('grid-box');
    if (!grid) return;
    const items = menuData.filter(i => (activeCat === 'All' || i.category === activeCat) && i.name.toLowerCase().includes(q));
    
    grid.innerHTML = items.map(i => {
        const isAvailable = i.available !== false;
        const imageHtml = i.image 
            ? `<img src="${i.image}" class="card-img" onclick="openImageViewer('${i.image}', '${i.name}')">`
            : `<div style="width: 100%; height: 100px; background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; cursor: pointer;" onclick="openImageViewer('https://i.ibb.co/FLb4YzNT/1771770596329.png', '${i.name}')">
                 <i class="fa-solid fa-drumstick-bite" style="font-size: 28px; margin-bottom: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.2);"></i>
                 <span style="font-size: 11px; font-weight: bold; opacity: 0.9;">မြင်သာကြက်ကင်</span>
               </div>`;

        return `
        <div class="card" style="${!isAvailable ? 'opacity: 0.7;' : ''}">
            ${imageHtml}
            <div class="card-info">
                <span class="item-name">${i.name}</span>
                <span class="item-price">${i.price} Ks</span>
                ${isAvailable 
                    ? `<button class="btn-add" onclick="addToCart(${i.id})">+ ထည့်မည်</button>`
                    : `<button class="btn-add" disabled style="background:#cbd5e1; color:#94a3b8; cursor:not-allowed;">မရနိုင်သေးပါ ❌</button>`
                }
            </div>
        </div>`;
    }).join('');
}

function checkSearchInput() {
    const q = document.getElementById('searchInput').value;
    document.getElementById('clearSearchBtn').style.display = q.length > 0 ? 'block' : 'none';
    renderMenu();
}

function clearMenuSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearchBtn').style.display = 'none';
    renderMenu();
}

function filterCat(c, el) {
    activeCat = c;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderMenu();
}

function addToCart(id) { cart[id] = (cart[id] || 0) + 1; updateFloatingBar(); }

function updateFloatingBar() {
    let t = 0;
    for (let id in cart) t += cart[id] * menuData.find(m => m.id == id).price;
    document.getElementById('cart-bar').style.display = t > 0 ? 'flex' : 'none';
    document.getElementById('bar-total').innerText = t.toLocaleString();
}

function openCart() {
    document.getElementById('receipt-view').style.display = 'none';
    document.getElementById('cart-content-wrapper').style.display = 'block';

    const list = document.getElementById('cart-list');
    let html = '', total = 0, count = 0;
    for (let id in cart) {
        const item = menuData.find(m => m.id == id);
        total += item.price * cart[id];
        count++;
        html += `
        <div class="cart-item">
            <img src="${item.image || 'https://via.placeholder.com/50'}" class="cart-item-img">
            <div class="cart-item-info">
                <b>${item.name}</b>
                <span>${item.price.toLocaleString()} Ks</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <div class="qty-group">
                    <button class="btn-q" onclick="changeQty(${id}, -1)">-</button>
                    <input type="number" class="val-q" value="${cart[id]}" onchange="manualQty(${id}, this.value)">
                    <button class="btn-q" onclick="changeQty(${id}, 1)">+</button>
                </div>
                <button class="btn-del" onclick="removeItem(${id})"><i class="fa-regular fa-trash-can"></i></button>
            </div>
        </div>`;
    }
    document.getElementById('item-count-badge').innerText = count + " မျိုး";
    list.innerHTML = html + '<div class="cart-total-row">စုစုပေါင်း: <span style="color:#0f172a; font-size: 18px; margin-left: 5px;">' + total.toLocaleString() + '</span> Ks</div>';
         
    document.getElementById('cart-sheet').style.display = 'block';
    document.getElementById('form-box').style.display = 'none';
    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('modal-title').innerText = "ခြင်းတောင်းစာရင်း";
    document.getElementById('modal-back').onclick = () => { document.getElementById('cart-sheet').style.display = 'none'; };
}

function removeItem(id) { delete cart[id]; if (Object.keys(cart).length === 0) document.getElementById('cart-sheet').style.display = 'none'; else openCart(); updateFloatingBar(); }
function changeQty(id, d) { cart[id] += d; if (cart[id] <= 0) delete cart[id]; if (Object.keys(cart).length === 0) document.getElementById('cart-sheet').style.display = 'none'; else openCart(); updateFloatingBar(); }
function manualQty(id, v) { let n = parseInt(v); if (n <= 0 || isNaN(n)) delete cart[id]; else cart[id] = n; if (Object.keys(cart).length === 0) document.getElementById('cart-sheet').style.display = 'none'; else openCart(); updateFloatingBar(); }

function selectDate(day) { chosenDay = day; document.getElementById('chip-today').classList.toggle('active', day === 'today'); document.getElementById('change-date-btn').classList.toggle('active', day === 'other'); document.getElementById('custom-date-row').style.display = day === 'other' ? 'block' : 'none'; }
function myPop(m) { document.getElementById('alert-msg').innerText = m; document.getElementById('alert-bg').style.display = 'block'; document.getElementById('alert-pop').style.display = 'block'; }
function closeAlert() { document.getElementById('alert-bg').style.display = 'none'; document.getElementById('alert-pop').style.display = 'none'; }

function step2() { 
    if (!isShopOpen) return myPop("ယခုအချိန် ဆိုင်ပိတ်ထားပါသည် ခင်ဗျာ။ 🔒");
    document.getElementById('form-box').style.display = 'block'; 
    document.getElementById('next-btn').style.display = 'none'; 
    document.getElementById('modal-title').innerText = "အချက်အလက်ဖြည့်ပါ"; 
    document.getElementById('modal-back').onclick = () => {
        document.getElementById('form-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'block';
        document.getElementById('modal-title').innerText = "ခြင်းတောင်းစာရင်း";
        document.getElementById('modal-back').onclick = () => { document.getElementById('cart-sheet').style.display = 'none'; };
    };
    setTimeout(() => { document.getElementById('form-box').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
}

async function sendOrder() {
    let name = document.getElementById('in-name').value.trim();
    let phone = document.getElementById('in-phone').value.trim();
    let time = document.getElementById('in-time').value;
    let otherDate = document.getElementById('in-date').value;
    let submitBtn = document.getElementById('submit-order-btn');

    if (!name || !phone || !time) {
        return myPop("အချက်အလက်တွေ ပြည့်စုံအောင် ဖြည့်ပေးပါ ✨");
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> အော်ဒါပို့နေပါသည်...";

    let vCode = `#MS-${Math.floor(1000 + Math.random() * 9000)}`;
    let dayStr = chosenDay === 'today' ? "ဒီနေ့" : otherDate;
    let itemsText = [], cartItemsForSheet = [], receiptTableRowsHtml = '', totalAmount = 0, canvasItems = [];

    for(let id in cart) {
        let i = menuData.find(m => m.id == id);
        if(i) {
            let itemTotal = i.price * cart[id];
            totalAmount += itemTotal;
            itemsText.push(`${i.name} (${cart[id]} ခု)`);
            cartItemsForSheet.push({ name: i.name, price: i.price, qty: cart[id], total: itemTotal });
            canvasItems.push({ name: i.name, price: i.price.toLocaleString(), qty: cart[id], total: itemTotal.toLocaleString() });
            receiptTableRowsHtml += `<tr><td>${i.name}</td><td>${i.price.toLocaleString()} Ks</td><td class="text-center">${cart[id]}</td><td class="text-right">${itemTotal.toLocaleString()} Ks</td></tr>`;
        }
    }

    let formattedTotal = totalAmount.toLocaleString();
    let ownerMsg = `🍗 *မြင်သာကြက်ကင် - အော်ဒါအသစ်*\n🧾 *ဘောက်ချာနံပါတ်:* \`${vCode}\`\n👤 *အမည်:* ${name}\n📞 *ဖုန်း:* ${phone}\n📅 *ရက်စွဲ:* ${dayStr}\n🕒 *အချိန်:* ${time}\n━━━━━━━━━━━━━━\n${itemsText.join('\n')}\n━━━━━━━━━━━━━━\n💰 *စုစုပေါင်း:* *${formattedTotal} MMK*`;

    try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: ownerMsg, parse_mode: 'Markdown' }) });

        await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                voucher: vCode,
                name: name,
                phone: phone,
                date: dayStr,
                time: time,
                items: JSON.stringify(cartItemsForSheet),
                total: formattedTotal,
                status: "Pending"
            })
        });

        let orderHistory = JSON.parse(localStorage.getItem('order_history') || '[]');
        orderHistory.unshift({ vCode, name, phone, date: dayStr, time, total: formattedTotal, tableRowsHtml: receiptTableRowsHtml, canvasItems });
        if(orderHistory.length > 5) orderHistory.pop();
        localStorage.setItem('order_history', JSON.stringify(orderHistory));

        showReceipt(vCode, name, phone, dayStr, time, receiptTableRowsHtml, formattedTotal, canvasItems);
        cart = {}; updateFloatingBar(); 
    } catch (e) { 
        myPop("Error! ပြန်လည်ကြိုးစားပေးပါ။"); 
        submitBtn.disabled = false;
        submitBtn.innerHTML = "<i class='fa-solid fa-circle-check'></i> အော်ဒါအတည်ပြုမည် ➔";
    }
}

function showReceipt(vCode, name, phone, date, time, tableRowsHtml, total) {
    document.getElementById('cart-content-wrapper').style.display = 'none';
    document.getElementById('modal-title').innerText = "🎉 အော်ဒါတင်ပြီးပါပြီ";
    document.getElementById('item-count-badge').innerText = "Success";
    document.getElementById('modal-back').style.display = 'none'; 

    const receiptView = document.getElementById('receipt-view');
    receiptView.style.display = 'block';
    receiptView.innerHTML = `<div style="text-align: center; color: #0f172a; margin: 15px 0;"><i class="fa-solid fa-circle-check" style="font-size: 40px;"></i><h4 style="margin: 8px 0 3px; font-size: 15px;">အော်ဒါတင်ခြင်း အောင်မြင်ပါသည်!</h4></div><div class="receipt-card"><div class="receipt-header"><b>🍗 မြင်သာကြက်ကင်</b><span style="font-size:12px; color:#ef4444; margin-top:4px;">Voucher No: ${vCode}</span></div><div class="receipt-row"><span>ဝယ်သူအမည်:</span> <span>${name}</span></div><div class="receipt-row"><span>ဖုန်း/ID:</span> <span>${phone}</span></div><div class="receipt-row"><span>နေ့ရက်/အချိန်:</span> <span>${date} (${time})</span></div><div class="receipt-divider"></div><table class="v-table"><thead><tr><th>အမည်</th><th>ဈေးနှုန်း</th><th class="text-center">ခုရေ</th><th class="text-right">စုစုပေါင်း</th></tr></thead><tbody>${tableRowsHtml}</tbody></table><div class="receipt-divider"></div><div class="receipt-row receipt-total-text"><span>စုစုပေါင်းကျသင့်ငွေ:</span> <span>${total} Ks</span></div></div><button class="btn-main" style="margin-top: 20px; background: #1e293b;" onclick="location.reload()"><i class="fa-solid fa-house"></i> ပင်မစာမျက်နှာသို့ ပြန်သွားမည်</button>`;
}

function viewOrderHistory() {
    const historyData = localStorage.getItem('order_history');
    if(!historyData || JSON.parse(historyData).length === 0) return myPop("မှာယူထားသော မှတ်တမ်း မရှိသေးပါ ခင်ဗျာ။ 🍗");
    document.getElementById('cart-content-wrapper').style.display = 'none';
    document.getElementById('modal-title').innerText = "📜 မှာယူမှုမှတ်တမ်း";
    document.getElementById('item-count-badge').innerText = "History";
    document.getElementById('modal-back').onclick = () => { document.getElementById('cart-sheet').style.display = 'none'; };
    
    const receiptView = document.getElementById('receipt-view');
    receiptView.style.display = 'block';
    
    let list = JSON.parse(historyData);
    let html = `<div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">`;
    list.forEach(item => {
        html += `<div style="background:#fff; border:1px solid #cbd5e1; border-radius:12px; padding:12px;"><b>${item.vCode}</b> - ${item.name}<br><small>${item.date} (${item.time})</small><br><span style="color:#ef4444; font-weight:bold;">ကျသင့်ငွေ: ${item.total} Ks</span></div>`;
    });
    html += `</div>`;
    receiptView.innerHTML = html;
    document.getElementById('cart-sheet').style.display = 'block';
}

async function openAdminPanel() {
    let password = prompt("🔐 Admin Password ထည့်ပါ:");
    if (password !== "1234") { 
        if(password !== null) alert("Password မှားယွင်းနေပါသည် ❌");
        return;
    }

    const cartContent = document.getElementById('cart-content-wrapper');
    if(cartContent) cartContent.style.display = 'none';

    document.getElementById('modal-title').innerText = "🛠️ ဆိုင်ရှင် Admin Dashboard";
    document.getElementById('item-count-badge').innerText = "Admin";
    document.getElementById('modal-back').onclick = () => { document.getElementById('cart-sheet').style.display = 'none'; };

    const receiptView = document.getElementById('receipt-view');
    receiptView.style.display = 'block';
    receiptView.innerHTML = `<div style="text-align:center; padding:40px;"><i class="fa-solid fa-spinner fa-spin" style="font-size:30px; color:#f59e0b;"></i><p style="margin-top:10px; font-weight:bold;">အချက်အလက်များ ဆွဲထုတ်နေပါသည်...</p></div>`;
    
    document.getElementById('cart-sheet').style.display = 'block';

    try {
        let response = await fetch(WEB_APP_URL);
        let orders = await response.json();
        window.cachedOrders = orders;
        renderAdminDashboard('dashboard'); 
    } catch (err) {
        receiptView.innerHTML = `<p style="text-align:center; color:#ef4444; padding:20px; font-weight:bold;">ဒေတာချိတ်ဆက်၍ မရပါ (Network Error) ❌</p>`;
    }
}

function renderAdminDashboard(tabType) {
    const orders = window.cachedOrders || [];
    const receiptView = document.getElementById('receipt-view');
    if(!receiptView) return;

    const pendingOrders = orders.filter(o => (o.Status || o.status || 'Pending') === 'Pending');

    let mainContentHtml = `<div style="padding-bottom: 70px;">`;

    if (tabType === 'dashboard') {
        let totalSales = 0;
        let uniqueCustomers = new Set();
        orders.forEach(o => {
            let cleanTotal = parseFloat((o.Total || o.total || '0').toString().replace(/,/g, '')) || 0;
            totalSales += cleanTotal;
            if(o.Phone || o.phone) uniqueCustomers.add(o.Phone || o.phone);
        });

        mainContentHtml += `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
            <div style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; padding: 15px; border-radius: 12px;">
                <div style="font-size: 11px; opacity: 0.9;"><i class="fa-solid fa-shopping-bag"></i> စုစုပေါင်းအော်ဒါ</div>
                <div style="font-size: 20px; font-weight: bold; margin-top: 5px;">${orders.length} ခု</div>
            </div>
            <div style="background: linear-gradient(135deg, #10b981, #047857); color: white; padding: 15px; border-radius: 12px;">
                <div style="font-size: 11px; opacity: 0.9;"><i class="fa-solid fa-money-bill-wave"></i> ရောင်းရငွေစုစုပေါင်း</div>
                <div style="font-size: 16px; font-weight: bold; margin-top: 5px;">${totalSales.toLocaleString()} Ks</div>
            </div>
            <div style="background: linear-gradient(135deg, #f59e0b, #b45309); color: white; padding: 15px; border-radius: 12px;">
                <div style="font-size: 11px; opacity: 0.9;"><i class="fa-solid fa-users"></i> ဝယ်သူဦးရေ</div>
                <div style="font-size: 20px; font-weight: bold; margin-top: 5px;">${uniqueCustomers.size} ဦး</div>
            </div>
            <div style="background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; padding: 15px; border-radius: 12px;">
                <div style="font-size: 11px; opacity: 0.9;"><i class="fa-solid fa-bell"></i> အော်ဒါအသစ် (Alert)</div>
                <div style="font-size: 20px; font-weight: bold; margin-top: 5px;">${pendingOrders.length} ခု</div>
            </div>
        </div>
        <div style="background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center; color: #475569; font-size: 12px;">
            💡 အောက်ပါ ဘားတန်းမှတစ်ဆင့် အော်ဒါများနှင့် မီနူးများကို စီမံနိုင်ပါသည်။
        </div>`;
    } 
    else if (tabType === 'new' || tabType === 'finished' || tabType === 'history') {
        let filtered = orders;
        if (tabType === 'new') filtered = orders.filter(o => (o.Status || o.status || 'Pending') === 'Pending');

                    <div style="background:#f8fafc; border-radius:8px; padding:6px; margin-bottom:8px; overflow-x: auto;">
                        <table style="width:100%; font-size:11px; border-collapse: collapse;">
                            <thead>
                                <tr style="background: #e2e8f0; color: #1e293b;">
                                    <th style="padding: 6px; text-align: left;">Name</th>
                                    <th style="padding: 6px; text-align: right;">Price</th>
                                    <th style="padding: 6px; text-align: center;">Qty</th>
                                    <th style="padding: 6px; text-align: right;">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${itemsTableRows}
                            </tbody>
                        </table>
                    </div>

                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:900; color:#ef4444; font-size:13px;">ကျသင့်ငွေ: ${totalStr} Ks</span>
                        ${tabType === 'new' ? `<button onclick="alert('Google Sheet တွင် Status ကို Finished သို့ ပြောင်းပေးပါ။')" style="background:#10b981; color:#fff; border:none; padding:6px 12px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;"><i class="fa-solid fa-check"></i> ပြီးစီးပြီ</button>` : ''}
                    </div>
                </div>`;
            });
            mainContentHtml += `</div>`;
        }
    } 
    else if (tabType === 'menu') {
        mainContentHtml += `
        <div style="background:#fff; border:1px solid #cbd5e1; border-radius:12px; padding:15px; margin-bottom: 15px;">
            <b style="font-size:13px; color:#1e293b; display:block; margin-bottom:10px;"><i class="fa-solid fa-plus-circle"></i> ဖုန်းထဲမှ ပုံတင်၍ မီနူးအသစ်ထည့်ရန်</b>
            
            <div style="margin-bottom: 8px;">
                <label style="font-weight:bold; display:block; margin-bottom:3px; font-size:11px;">ဟင်းပွဲအမည်:</label>
                <input type="text" id="newMenuName" placeholder="ဥပမာ- ကြက်ဥစပ်" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; font-size:12px;">
            </div>

            <div style="margin-bottom: 8px;">
                <label style="font-weight:bold; display:block; margin-bottom:3px; font-size:11px;">ဈေးနှုန်း (Ks):</label>
                <input type="number" id="newMenuPrice" placeholder="1500" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; font-size:12px;">
            </div>

            <div style="margin-bottom: 8px;">
                <label style="font-weight:bold; display:block; margin-bottom:3px; font-size:11px;">အမျိုးအစား:</label>
                <select id="newMenuCat" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; font-size:12px;">
                    <option value="အသား">အသား</option>
                    <option value="အရိုး">အရိုး</option>
                    <option value="အသီးအရွက်">အသီးအရွက်</option>
                    <option value="အရေခွံ">အရေခွံ</option>
                    <option value="ကလီစာ">ကလီစာ</option>
                    <option value="ဥ">ဥ</option>
                </select>
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-weight:bold; display:block; margin-bottom:3px; font-size:11px;">ပုံရွေးချယ်ရန်:</label>
                <input type="file" id="newMenuFile" accept="image/*" onchange="previewUploadedImage(event)" style="font-size:11px;">
                <div id="imagePreviewContainer" style="margin-top:6px;"></div>
            </div>

            <button onclick="saveNewMenu()" style="width:100%; background:#2563eb; color:white; border:none; padding:10px; border-radius:8px; font-weight:bold; font-size:12px; cursor:pointer;">
                <i class="fa-solid fa-upload"></i> မီနူးအသစ် သိမ်းဆည်းမည်
            </button>
        </div>

        <b style="font-size:13px; color:#1e293b; display:block; margin-bottom:8px;"><i class="fa-solid fa-list"></i> လက်ရှိ မီနူးစာရင်းများ (${menuData.length} ခု)</b>
        <div style="display:flex; flex-direction:column; gap:6px;">`;

        menuData.forEach((m) => {
            mainContentHtml += `
            <div style="background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; font-size:12px;">
                <div><b>${m.name}</b> (${m.category}) - <span style="color:#ef4444; font-weight:bold;">${m.price} Ks</span></div>
                <button onclick="deleteCustomMenu(${m.id})" style="background:#fee2e2; color:#ef4444; border:none; padding:4px 8px; border-radius:6px; cursor:pointer; font-weight:bold;"><i class="fa-solid fa-trash"></i></button>
            </div>`;
        });
        mainContentHtml += `</div>`;
    }

    mainContentHtml += `</div>`;

    let bottomNavBarHtml = `
    <div style="position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: auto; background: #1e293b; display: flex; justify-content: space-around; padding: 10px 5px; z-index: 300; border-top-left-radius: 16px; border-top-right-radius: 16px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1);">
        <button onclick="renderAdminDashboard('dashboard')" style="background:none; border:none; color:${tabType==='dashboard'?'#fbbf24':'#94a3b8'}; display:flex; flex-direction:column; align-items:center; font-size:10px; font-weight:bold; cursor:pointer;">
            <i class="fa-solid fa-chart-pie" style="font-size:16px; margin-bottom:2px;"></i> Dashboard
        </button>
        <button onclick="renderAdminDashboard('new')" style="background:none; border:none; color:${tabType==='new'?'#fbbf24':'#94a3b8'}; display:flex; flex-direction:column; align-items:center; font-size:10px; font-weight:bold; cursor:pointer;">
            <i class="fa-solid fa-bell" style="font-size:16px; margin-bottom:2px;"></i> အော်ဒါ (${pendingOrders.length})
        </button>
        <button onclick="renderAdminDashboard('finished')" style="background:none; border:none; color:${tabType==='finished'?'#fbbf24':'#94a3b8'}; display:flex; flex-direction:column; align-items:center; font-size:10px; font-weight:bold; cursor:pointer;">
            <i class="fa-solid fa-check-circle" style="font-size:16px; margin-bottom:2px;"></i> ပြီးစီး
        </button>
        <button onclick="renderAdminDashboard('history')" style="background:none; border:none; color:${tabType==='history'?'#fbbf24':'#94a3b8'}; display:flex; flex-direction:column; align-items:center; font-size:10px; font-weight:bold; cursor:pointer;">
            <i class="fa-solid fa-history" style="font-size:16px; margin-bottom:2px;"></i> မှတ်တမ်း
        </button>
        <button onclick="renderAdminDashboard('menu')" style="background:none; border:none; color:${tabType==='menu'?'#fbbf24':'#94a3b8'}; display:flex; flex-direction:column; align-items:center; font-size:10px; font-weight:bold; cursor:pointer;">
            <i class="fa-solid fa-utensils" style="font-size:16px; margin-bottom:2px;"></i> မီနူးစာရင်း
        </button>
    </div>`;

    receiptView.innerHTML = mainContentHtml + bottomNavBarHtml;
}

let uploadedImageBase64 = "";
function previewUploadedImage(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            uploadedImageBase64 = e.target.result;
            document.getElementById('imagePreviewContainer').innerHTML = `<img src="${uploadedImageBase64}" style="width: 70px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1;">`;
        };
        reader.readAsDataURL(file);
    }
}

function saveNewMenu() {
    let name = document.getElementById('newMenuName').value.trim();
    let price = parseInt(document.getElementById('newMenuPrice').value);
    let category = document.getElementById('newMenuCat').value;

    if (!name || isNaN(price)) {
        alert("ဟင်းပွဲအမည်နှင့် ဈေးနှုန်း မှန်ကန်စွာ ဖြည့်ပါ။");
        return;
    }

    let newId = menuData.length > 0 ? Math.max(...menuData.map(m => m.id)) + 1 : 1;
    let newItem = {
        id: newId,
        name: name,
        price: price,
        category: category,
        image: uploadedImageBase64 || ''
    };

    menuData.push(newItem);
    localStorage.setItem('custom_menu_items', JSON.stringify(menuData));

    alert("✅ မီနူးအသစ် အောင်မြင်စွာ ထည့်သွင်းပြီးပါပြီ!");
    renderMenu();
    renderAdminDashboard('menu');
}

function deleteCustomMenu(id) {
    if(confirm("ဒီမီနူးကို ဖျက်မှာ သေချာပါသလား?")) {
        menuData = menuData.filter(m => m.id !== id);
        localStorage.setItem('custom_menu_items', JSON.stringify(menuData));
        renderMenu();
        renderAdminDashboard('menu');
    }
}

function openImageViewer(imgUrl, itemName) {
    document.getElementById('viewerImageTarget').src = imgUrl;
    document.getElementById('viewerImageTitle').innerText = itemName;
    document.getElementById('imageViewerModal').style.display = 'flex';
}
function closeImageViewer() {
    document.getElementById('imageViewerModal').style.display = 'none';
    document.getElementById('viewerImageTarget').src = ''; 
}

window.addEventListener('DOMContentLoaded', () => {
    renderMenu();
});
</script>
</body>
